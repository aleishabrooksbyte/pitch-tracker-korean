<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- This is the magic line that fixes mobile scaling -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Korean Pitch Tracker</title>
    <style>
        body { 
            font-family: -apple-system, sans-serif; 
            padding: 20px; 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 90vh; 
            background-color: #f9f9f9; 
            text-align: center;
        }
        .word-display { font-size: 2.5em; margin: 15px 0; color: #111; word-wrap: break-word; padding: 0 10px; }
        .english-display { font-size: 1.2em; color: #666; margin-bottom: 30px; }
        button { 
            padding: 15px 25px; 
            font-size: 1.2em; 
            margin: 10px; 
            border-radius: 12px; 
            border: none; 
            background-color: #007aff; 
            color: white; 
            width: 85%; 
            max-width: 320px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
        }
        #next-button { display: none; background-color: #34c759; }
        #recording-button { background-color: #ff3b30; }
        #feedback { margin-top: 20px; font-size: 1.3em; font-weight: bold; height: 30px; }
        .correct { color: #34c759; }
        .incorrect { color: #ff3b30; }
    </style>
</head>
<body>
    <h2>Korean Practice</h2>
    <div class="word-display" id="target-word">안녕하세요</div>
    <div class="english-display" id="english-meaning">(Hello)</div>
    
    <button id="listen-button">🔊 Hear Phrase</button>
    <button id="recording-button">🎤 Start Recording</button>
    <button id="next-button">Next Phrase ➡️</button>
    
    <div id="transcription-result" style="margin-top: 20px; min-height: 30px; font-size: 1.2em; color: #555;"></div>
    <div id="feedback"></div>

    <script src="speech-api.js"></script>
</body>
</html>
