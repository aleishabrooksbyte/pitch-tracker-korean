<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Korean Pitch Tracker</title>
    <style>
        body { 
            font-family: -apple-system, sans-serif; 
            padding: 20px; 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 90vh; 
            background-color: #f9f9f9; 
            text-align: center;
        }
        h2 { font-size: 1.8em; color: #333; margin-bottom: 10px; }
        .word-display { font-size: 2.5em; margin: 15px 0; color: #111; word-wrap: break-word; padding: 0 10px; font-weight: bold; }
        .english-display { font-size: 1.3em; color: #666; margin-bottom: 15px; }
        .deck-info { font-size: 0.95em; color: #888; margin-bottom: 15px; }
        button, input { 
            padding: 14px 20px; 
            font-size: 1.1em; 
            margin: 8px 0; 
            border-radius: 12px; 
            border: 1px solid #ccc; 
            width: 100%; 
            max-width: 340px; 
            box-sizing: border-box;
        }
        button { border: none; color: white; box-shadow: 0 4px 6px rgba(0,0,0,0.1); cursor: pointer; font-weight: bold; }
        input { background-color: #fff; text-align: center; }
        #listen-button { background-color: #007aff; }
        #recording-button { background-color: #ff3b30; }
        #next-button { display: none; background-color: #34c759; }
        #skip-button { background-color: #ff9500; }
        #add-button { background-color: #5856d6; }
        #upload-screenshot-btn { background-color: #af52de; }
        #export-button { background-color: #8e8e93; font-size: 1em; }
        #feedback { margin-top: 15px; font-size: 1.2em; font-weight: bold; min-height: 30px; }
        .correct { color: #34c759; }
        .incorrect { color: #ff3b30; }
        .input-container { margin-top: 25px; border-top: 1px solid #ddd; padding-top: 20px; width: 100%; max-width: 340px; display: flex; flex-direction: column; align-items: center; }
    </style>
</head>
<body>
    <h2>Korean Practice</h2>
    <div class="word-display" id="target-word">안녕하세요</div>
    <div class="english-display" id="english-meaning">(Hello)</div>
    <div class="deck-info" id="deck-counter">Practice Deck: 0 phrases</div>
    
    <button id="listen-button">🔊 Hear Phrase</button>
    <button id="recording-button">🎤 Start Recording</button>
    <button id="next-button">Next Phrase ➡️</button>
    <button id="skip-button">⏭️ Skip Phrase</button>
    
    <div id="transcription-result" style="margin-top: 15px; min-height: 25px; font-size: 1.1em; color: #555;"></div>
    <div id="feedback"></div>

    <div class="input-container">
        <input type="text" id="new-korean" placeholder="Type Korean phrase...">
        <input type="text" id="new-english" placeholder="Type English meaning...">
        <button id="add-button">➕ Add to Practice Deck</button>
        
        <input type="file" id="screenshot-input" accept="image/*" style="display: none;">
        <button id="upload-screenshot-btn">📷 Upload Screenshot</button>
        <div id="ocr-status" style="font-size: 0.9em; color: #666; margin-top: 8px;"></div>
        
        <button id="export-button">📥 Export Custom Phrases</button>
    </div>

    <!-- Tesseract.js for OCR -->
    <script src="https://unpkg.com/tesseract.js@v2.1.0/dist/tesseract.min.js"></script>
    <script src="speech-api.js"></script>
</body>
</html>
