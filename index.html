<div class="input-container">
        <input type="text" id="new-korean" placeholder="Type Korean phrase...">
        <input type="text" id="new-english" placeholder="Type English meaning...">
        <button id="add-button">➕ Add to Practice Deck</button>
        
        <!-- New Image Upload Section -->
        <div style="margin-top: 15px; width: 100%; display: flex; flex-direction: column; align-items: center;">
            <input type="file" id="screenshot-input" accept="image/*" style="display: none;">
            <button id="upload-screenshot-btn" style="background-color: #ff9500;">📷 Upload Screenshot to Extract</button>
            <div id="ocr-status" style="font-size: 0.9em; color: #666; margin-top: 5px;"></div>
        </div>

        <button id="export-button">📥 Export Custom Phrases (JSON)</button>
    </div>

    <!-- Include Tesseract.js for OCR (Optical Character Recognition) -->
    <script src="https://unpkg.com/tesseract.js@v2.1.0/dist/tesseract.min.js"></script>
    <script src="speech-api.js"></script>
